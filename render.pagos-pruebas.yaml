services:
  - type: web
    name: alphabike-pagos-pruebas-api
    runtime: docker
    plan: free
    region: oregon
    branch: codex/mercadopago-pruebas
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/servicios
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: alphabike-pagos-pruebas-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: alphabike-pagos-pruebas-db
          property: database
      - key: DB_URL
        value: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      - key: DB_USERNAME
        fromDatabase:
          name: alphabike-pagos-pruebas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: alphabike-pagos-pruebas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: HISTORIAL_ENABLED
        value: "false"
      - key: APP_FRONTEND_URL
        value: https://alphabike-pagos-pruebas.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://alphabike-pagos-pruebas.onrender.com
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60.0
      - key: APP_MAIL_LOG_LINKS
        value: "true"
      - key: MP_CHECKOUT_ENABLED
        value: "true"
      - key: MP_LIVE
        value: "false"
  - type: web
    name: alphabike-pagos-pruebas
    runtime: static
    repo: https://github.com/ITP89/alphabike-frontend
    branch: codex/mercadopago-pruebas
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://alphabike-pagos-pruebas-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: alphabike-pagos-pruebas-db
    plan: free
    region: oregon
    ipAllowList: []
