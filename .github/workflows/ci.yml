name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn -B test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alphabike_test
          POSTGRES_USER: alphabike
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphabike -d alphabike_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/alphabike_test
      TEST_DB_USERNAME: alphabike
      TEST_DB_PASSWORD: ci_test_password
      TEST_DB_DRIVER: org.postgresql.Driver
      TEST_DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      TEST_SQL_INIT_MODE: never
      TEST_DDL_AUTO: validate
      TEST_FLYWAY_ENABLED: true
      MONGO_TEST_URI: mongodb://localhost:27017/alphabike_test?serverSelectionTimeoutMS=2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: PostgreSQL migrations, HTTP, WebSocket and real MongoDB history
        run: mvn -B -Dtest=Avance2IntegrationTest,HistorialMongoIntegrationTest,TallerConcurrencyIntegrationTest test
