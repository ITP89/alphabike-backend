spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:alphabike_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}

spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.mode=${TEST_SQL_INIT_MODE:embedded}
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${TEST_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}

jwt.secret=test-secret-for-alphabike-with-more-than-32-chars
jwt.expiration=86400000
cors.allowed-origins=http://localhost:5173
