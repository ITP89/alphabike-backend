# Nombre de la app
spring.application.name=backend

# Permite cargar variables locales desde backend/.env si existe.
spring.config.import=optional:file:.env[.properties]

# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.repair-on-migrate=${FLYWAY_REPAIR_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Admin Seed
app.seed.admin.enabled=${APP_SEED_ADMIN_ENABLED:true}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:admin@alphabike.com}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:admin1234}
app.seed.admin.name=${APP_SEED_ADMIN_NAME:Administrador AlphaBike}
app.seed.admin.phone=${APP_SEED_ADMIN_PHONE:999999999}
