# Copia este archivo como .env o exporta estas variables en tu entorno.
# Nunca subas credenciales reales al repositorio.

DB_URL=jdbc:postgresql://localhost:5432/alphabike
DB_USERNAME=alphabike
DB_PASSWORD=alphabike_dev_password

# Usa un valor aleatorio de al menos 32 caracteres para HS256.
JWT_SECRET=replace-with-a-long-random-secret-of-at-least-32-chars
JWT_EXPIRATION_MS=86400000

SERVER_PORT=8080
CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

JPA_DDL_AUTO=validate
JPA_SHOW_SQL=false
JPA_FORMAT_SQL=false

FLYWAY_ENABLED=true
FLYWAY_BASELINE_ON_MIGRATE=true
FLYWAY_REPAIR_ON_MIGRATE=false
FLYWAY_VALIDATE_ON_MIGRATE=true

SPRINGDOC_API_DOCS_ENABLED=false
SPRINGDOC_SWAGGER_UI_ENABLED=false

# URL usada en los enlaces de verificacion y recuperacion.
APP_FRONTEND_URL=http://localhost:5173

# SMTP opcional. Si no se configura, el backend mantiene el flujo sin exponer tokens.
MAIL_HOST=smtp.gmail.com
MAIL_PORT=587
MAIL_USERNAME=
MAIL_PASSWORD=
MAIL_SMTP_AUTH=true
MAIL_SMTP_STARTTLS=true
APP_MAIL_FROM=AlphaBike <no-reply@alphabike.com>
# Solo para desarrollo local; imprime enlaces con token en los logs.
APP_MAIL_LOG_LINKS=false

# Seed opcional para desarrollo. No activarlo en produccion.
APP_SEED_ADMIN_ENABLED=false
APP_SEED_ADMIN_EMAIL=admin@alphabike.com
APP_SEED_ADMIN_PASSWORD=
APP_SEED_ADMIN_NAME=Administrador AlphaBike
APP_SEED_ADMIN_PHONE=999999999
