# Perfil local para desarrollo/demo sin Supabase.
# Ejecutar con: mvn spring-boot:run "-Dspring-boot.run.profiles=demo"

spring.datasource.url=jdbc:h2:file:./data/alphabike_demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false

jwt.secret=demo-secret-for-alphabike-with-more-than-32-chars
jwt.expiration=86400000

cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

app.seed.admin.enabled=true
app.seed.admin.email=admin@alphabike.com
app.seed.admin.password=admin1234
app.seed.admin.name=Administrador AlphaBike
app.seed.admin.phone=999999999

app.seed.demo.enabled=true
