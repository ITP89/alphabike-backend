services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alphabike
      POSTGRES_USER: alphabike
      POSTGRES_PASSWORD: alphabike_dev_password
    ports:
      - "5432:5432"
    volumes:
      - alphabike-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphabike -d alphabike"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: alphabike
      MONGO_INITDB_ROOT_PASSWORD: alphabike_mongo_dev_password
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - alphabike-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "alphabike", "--password", "alphabike_mongo_dev_password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      MONGODB_URI: mongodb://alphabike:alphabike_mongo_dev_password@mongo:27017/alphabike?authSource=admin&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=3000
      DB_URL: jdbc:postgresql://postgres:5432/alphabike
      DB_USERNAME: alphabike
      DB_PASSWORD: alphabike_dev_password
      JWT_SECRET: local-compose-secret-for-alphabike-with-more-than-32-chars
      APP_SEED_ADMIN_ENABLED: "true"
      APP_SEED_ADMIN_PASSWORD: admin1234
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../alphabike-frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  alphabike-postgres:
  alphabike-mongo:
