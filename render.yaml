# Render Blueprint: connects to existing external PostgreSQL and MongoDB.
# Configure private values in Render; never commit them here.
services:
  - type: web
    name: alphabike-backend
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/servicios
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: HISTORIAL_ENABLED
        value: "true"
      - key: APP_FRONTEND_URL
        value: https://alphabike-frontend.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://alphabike-frontend.vercel.app
      - key: WS_ALLOWED_ORIGINS
        value: https://alphabike-frontend.vercel.app
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=60.0
      - key: APP_SEED_ADMIN_ENABLED
        value: "false"
      - key: APP_MAIL_LOG_LINKS
        value: "false"
